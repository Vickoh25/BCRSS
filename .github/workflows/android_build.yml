name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Force Compatibility Patch
        run: |
          FLUTTER_GRADLE_DIR="$FLUTTER_ROOT/packages/flutter_tools/gradle"
          FLUTTER_GROOVY="$FLUTTER_GRADLE_DIR/src/main/groovy/flutter.groovy"

          # Older Flutter SDKs used this file; newer SDKs removed it.
          if [ -f "$FLUTTER_GROOVY" ]; then
            sed -i 's/import groovy.xml.QName//g' "$FLUTTER_GROOVY"
            sed -i '1i import groovy.xml.XmlParser' "$FLUTTER_GROOVY"
            sed -i '1i import javax.xml.namespace.QName' "$FLUTTER_GROOVY"
          else
            echo "Skipping Groovy XML patch; $FLUTTER_GROOVY was not found."
          fi
          
          # Fix ProGuard in SDK files when those files exist.
          if [ -d "$FLUTTER_GRADLE_DIR" ]; then
            find "$FLUTTER_GRADLE_DIR" -name "*.groovy" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +
            find "$FLUTTER_GRADLE_DIR" -name "*.kts" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +
          fi
          
      - name: Build APK
        run: |
          cd bcrss_mobile
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bcrss-app-release
          path: bcrss_mobile/build/app/outputs/flutter-apk/app-release.apk
