services:
  - type: web
    name: bcrss-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && sh entrypoint.sh
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bcrss-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: bcrss-db
    plan: free
    databaseName: bcrss_db
    user: bcrss_user
